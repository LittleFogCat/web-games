<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03070f">
  <title>WEB GAMES // LittleFogCat</title>
  <style>
    :root { color-scheme: dark; --cyan:#63f4ee; --gold:#ffc15a; --muted:#7f9bac; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 28px;
      color: #e8fbff;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(50, 180, 190, 0.16), transparent 55%),
        radial-gradient(ellipse at 100% 90%, rgba(90, 70, 160, 0.18), transparent 60%),
        #03070f;
      font-family: "Bahnschrift", "Microsoft YaHei", sans-serif;
    }
    main { width: min(760px, 100%); }
    .eyebrow {
      color: var(--cyan);
      font: 11px/1.2 "Cascadia Mono", Consolas, monospace;
      letter-spacing: 0.24em;
    }
    h1 {
      margin: 12px 0 8px;
      font-size: clamp(34px, 8vw, 66px);
      line-height: 0.95;
      letter-spacing: 0.06em;
      font-weight: 500;
    }
    h1 span { color: var(--cyan); }
    .sub { margin: 0 0 28px; color: var(--muted); font-size: 13px; }
    .game {
      display: block;
      padding: 22px;
      border: 1px solid rgba(99, 244, 238, 0.28);
      color: inherit;
      text-decoration: none;
      background: linear-gradient(145deg, rgba(11, 33, 45, 0.9), rgba(5, 12, 22, 0.95));
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      transition: border-color 160ms ease, transform 160ms ease;
    }
    .game:hover { border-color: var(--cyan); transform: translateY(-2px); }
    .tag {
      color: var(--gold);
      font: 10px/1 "Cascadia Mono", Consolas, monospace;
      letter-spacing: 0.14em;
    }
    h2 { margin: 10px 0 8px; font-size: 25px; letter-spacing: 0.04em; font-weight: 500; }
    p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(120, 190, 210, 0.14);
      color: var(--muted);
      font: 10px/1.4 "Cascadia Mono", Consolas, monospace;
      letter-spacing: 0.04em;
    }
    .go { margin-left: auto; color: var(--cyan); }
    footer { margin-top: 22px; color: rgba(127, 155, 172, 0.65); font: 10px/1.4 "Cascadia Mono", Consolas, monospace; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">LITTLEFOG CAT / WEB ARCADE</div>
    <h1>WEB<br><span>GAMES</span></h1>
    <p class="sub">Small worlds, built from lines.</p>

    <a class="game" href="./vector-td/">
      <div class="tag">SECTOR GAME / 01</div>
      <h2>VECTOR // 矢界防线</h2>
      <p>霓虹几何深空塔防。部署防御塔与偏折壁垒，在十片星区中守住最后的星域核心。</p>
      <div class="meta">
        <span>10 SECTORS</span>
        <span>7 TOWER TYPES</span>
        <span>12 TOWER LIMIT</span>
        <span class="go">ENTER →</span>
      </div>
    </a>

    <footer>BUILD 1.6.2 // MORE GAMES COMING</footer>
  </main>
</body>
</html>
